# Run the production backend image plus the frontend dev server locally.
# Settings come from backend/.env and frontend/.env (see the .env.example files).
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - PORT=8000
      # SQLite on the volume unless backend/.env sets a Postgres DATABASE_URL.
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/vidmind.db}
      - ALLOWED_ORIGINS=http://localhost:5173
      # Ollama runs on the host, not in the container.
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - vidmind-data:/data

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  vidmind-data:
